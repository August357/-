services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ragflow-backend
    environment:
      # 必填：JWT 签名密钥（也可放入根目录 .env，compose 会自动读取）
      JWT_SECRET: ${JWT_SECRET:?请先在环境变量或 .env 中设置 JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # 模型目录（chatglm3-6b / bge-large-zh-v1.5 / bge-reranker-base）
      - ./models:/app/models
      # 知识库文档与 SQLite 数据
      - ./data:/app/data
      # 向量库
      - ./vector_db:/app/vector_db
      # 日志
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    # GPU 部署时取消注释（需 nvidia-container-toolkit）：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ragflow-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
